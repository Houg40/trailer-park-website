<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="360" fill="#F4EFE6"/>
  <!-- Flooring: Luxury Vinyl Plank -->
  <rect y="360" width="800" height="140" fill="#9C6B46"/>
  <line x1="0" y1="390" x2="800" y2="390" stroke="#875836" stroke-width="2"/>
  <line x1="0" y1="425" x2="800" y2="425" stroke="#875836" stroke-width="2"/>
  <line x1="0" y1="465" x2="800" y2="465" stroke="#875836" stroke-width="2"/>
  <!-- Crown Molding & Baseboard -->
  <rect x="0" y="0" width="800" height="12" fill="#FFFFFF"/>
  <rect x="0" y="352" width="800" height="10" fill="#FFFFFF"/>
  <!-- Window with Outside Sunshine -->
  <rect x="280" y="40" width="240" height="180" fill="#6B92A4" stroke="#FFFFFF" stroke-width="12"/>
  <line x1="400" y1="40" x2="400" y2="220" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="280" y1="130" x2="520" y2="130" stroke="#FFFFFF" stroke-width="8"/>
  <!-- Green outside -->
  <circle cx="360" cy="180" r="40" fill="#4B7E53"/>
  <circle cx="440" cy="170" r="45" fill="#355E3B"/>
  <!-- Furnishing -->
  <rect x="200" y="270" width="400" height="90" rx="8" fill="#355E3B"/>
  <rect x="240" y="250" width="150" height="30" rx="4" fill="#4A7A52"/>
  <rect x="410" y="250" width="150" height="30" rx="4" fill="#4A7A52"/>
  <!-- Overlay Label -->
  <rect x="24" y="24" width="280" height="54" rx="6" fill="#FFFFFF" opacity="0.95" stroke="#DDD6C8"/>
  <text x="40" y="48" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2F3437">Open Living Area</text>
  <text x="40" y="66" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C9783A">SmartComfort Insulation & Vinyl Plank</text>
</svg>