<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE8E1"/>
      <stop offset="60%" stop-color="#EEF5F0"/>
      <stop offset="100%" stop-color="#F3EFE6"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F7955"/>
      <stop offset="100%" stop-color="#355E3B"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555E63"/>
      <stop offset="100%" stop-color="#383E42"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="320" fill="url(#sky)"/>
  <circle cx="700" cy="80" r="45" fill="#FFE8B3" opacity="0.6"/>
  <path d="M120 120 Q160 100 200 120 Q240 105 280 125 L120 125 Z" fill="#FFFFFF" opacity="0.5"/>
  <path d="M520 100 Q560 85 600 100 Q640 90 680 105 L520 105 Z" fill="#FFFFFF" opacity="0.4"/>

  <!-- Distant Trees -->
  <path d="M0 290 Q60 260 120 285 Q180 250 240 280 Q300 265 360 285 Q420 255 480 280 Q540 260 600 285 Q660 250 720 280 Q760 265 800 285 L800 320 L0 320 Z" fill="#2E5033" opacity="0.35"/>

  <!-- Road & Pavement -->
  <rect y="320" width="800" height="180" fill="url(#grass)"/>
  <polygon points="340,320 460,320 620,500 180,500" fill="#42474A"/>
  <polygon points="395,320 405,320 408,340 392,340" fill="#FFC83B"/>
  <polygon points="392,370 408,370 412,410 388,410" fill="#FFC83B"/>
  <polygon points="386,440 414,440 418,490 382,490" fill="#FFC83B"/>

  <!-- Sidewalks -->
  <polygon points="260,320 330,320 160,500 70,500" fill="#D3CBC0"/>
  <polygon points="470,320 540,320 730,500 640,500" fill="#D3CBC0"/>

  <!-- Manufactured Home Model (Left) -->
  <g transform="translate(40, 200)">
    <!-- House Foundation/Skirting -->
    <rect x="20" y="90" width="220" height="25" fill="#C8C0B2" stroke="#A89F90"/>
    <!-- House Main Body -->
    <rect x="20" y="30" width="220" height="60" fill="#FAF6EE" stroke="#DDD6C8"/>
    <!-- Siding Lines -->
    <line x1="20" y1="42" x2="240" y2="42" stroke="#EAE3D5"/>
    <line x1="20" y1="54" x2="240" y2="54" stroke="#EAE3D5"/>
    <line x1="20" y1="66" x2="240" y2="66" stroke="#EAE3D5"/>
    <line x1="20" y1="78" x2="240" y2="78" stroke="#EAE3D5"/>
    <!-- Pitched Roof -->
    <polygon points="10,30 130,5 250,30" fill="url(#roof)"/>
    <!-- Windows -->
    <rect x="40" y="42" width="36" height="34" fill="#6B92A4" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="58" y1="42" x2="58" y2="76" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="40" y1="59" x2="76" y2="59" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="90" y="42" width="36" height="34" fill="#6B92A4" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="108" y1="42" x2="108" y2="76" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="90" y1="59" x2="126" y2="59" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Front Door & Porch -->
    <rect x="150" y="40" width="24" height="50" fill="#355E3B"/>
    <circle cx="168" cy="65" r="2" fill="#FFE8B3"/>
    <rect x="142" y="85" width="40" height="30" fill="#B38758"/>
    <rect x="140" y="70" width="4" height="25" fill="#FFFFFF"/>
    <rect x="180" y="70" width="4" height="25" fill="#FFFFFF"/>
  </g>

  <!-- Modern Home Model (Right) -->
  <g transform="translate(520, 210)">
    <rect x="20" y="85" width="220" height="25" fill="#C8C0B2" stroke="#A89F90"/>
    <rect x="20" y="25" width="220" height="60" fill="#E8EEF2" stroke="#C5D3DC"/>
    <polygon points="10,25 130,2 250,25" fill="#8C5338"/>
    <!-- Front Covered Porch -->
    <rect x="35" y="45" width="70" height="40" fill="#FAF6EE"/>
    <polygon points="30,45 70,30 110,45" fill="#8C5338"/>
    <rect x="35" y="80" width="70" height="30" fill="#D3CBC0"/>
    <rect x="130" y="40" width="36" height="34" fill="#6B92A4" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="180" y="40" width="36" height="34" fill="#6B92A4" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Front Oak Trees -->
  <g transform="translate(260, 180)">
    <rect x="26" y="90" width="12" height="60" fill="#5A3D28"/>
    <circle cx="32" cy="70" r="40" fill="#3D6B44"/>
    <circle cx="20" cy="55" r="30" fill="#4B7E53"/>
    <circle cx="45" cy="55" r="32" fill="#355E3B"/>
  </g>

  <!-- Banner label overlay -->
  <rect x="24" y="24" width="340" height="68" rx="8" fill="#FFFFFF" opacity="0.92" stroke="#E3DDD4"/>
  <text x="44" y="52" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2F3437">Pine Valley Living</text>
  <text x="44" y="74" font-family="sans-serif" font-size="13" font-weight="600" fill="#355E3B">Spokane, WA • Peaceful Pine Country</text>
</svg>